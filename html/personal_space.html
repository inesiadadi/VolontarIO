<!DOCTYPE html>
<html lang="it">
    <head>
        <meta author="Suar Alberto">
        <meta charset="UTF-8">
        <meta name="description" content="Pagina dedicata alla gestione e visualizzazione delle informazioni del tuo account personale su VolontarIO">
        <meta name="keywords" content="accesso, account, spazio personale, privato">
        <meta name="robots" content="index, follow">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>volontarIO | Account Personale</title>

        <link rel="stylesheet" href=" ">
    </head>
    <body>
        <header>
            <img src="../images/logo_volontarIO.png" alt="Immagine logo volontarIO" style="width: 100px;">
            <nav id="menu">
                <ul>
                    <li lang="en">Home</li>
                    <li>Chi siamo</li>
                    <li>Sfoglia Richieste</li>
                    <li><a href="personal_space.html"><span lang="en">Account</span> personale</a></li>
                </ul>
            </nav>
        </header>
        <main id="accountPage">
            <h1>L'Angolo del Volontario</h1>
            <div id="profile">
                <section id="mainInfo">
                    <img id="pfp" alt="Immagine profilo dell'utente">
                    <h2>Nome e Cognome</h2>
                    <h3>@Username</h3>
                    <dl id="aboutMe">
                        <dt>Città</dt>
                        <dd id="city">Nome Città</dd>

                        <dt>Email</dt>
                        <dd id="email">email utente</dd>

                        <dt>Numero di Telefono</dt>
                        <dd id="phone">cellulare</dd>

                        <dt>Social</dt>
                        <dd>
                            <ul id="socialList">
                                <li><span lang="en">Instagram</span></li>
                                <li><span lang="en">LinkedIn</span></li>
                                <li><span lang="en">TikTok</span></li>
                            </ul>
                        </dd>
                    </dl>
                </section>
                <section class="accountInfoContainer" id="info">
                    <!-- Qui andranno la textArea, la valutazione generale dell'utente e le recensioni -->
                    <!-- Ora sono stanco quindi lo farò un altro giorno -->
                </section>
            </div>
        </main>
        <footer>
                <p>© 2025 VolontarIO <span lang="en">All rights Reserved</span></p>
        </footer>
    </body>
</html>
