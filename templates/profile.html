<div class="profileContainer" itemscope itemtype="https://schema.org/Person">
    <h1 class="profilePageTitle">L'Angolo del Volontario</h1>
    <div class="profileGrid">
        <aside class="profileInfoColumn">
            <div class="userMainInfo">
                <div class="profilePicture">
                    <img src="[FotoProfilo]" alt="Foto Profilo di [Nome] [Cognome]" class="userPfP" itemprop="image">
                </div>
                <h2 class="identity" itemprop="name">[Nome] [Cognome]</h2>
                <h3 class="username" itemprop="alternateName">@[Username]</h3>
            </div>
            <dl class="info-list">
                <div class="info-item">
                    <dt class="label">Nascita:</dt>
                    <dd class="value">
                        <time datetime="[DataISO]" itemprop="birthDate">[DataVisual]</time>
                    </dd>
                </div>
                <div class="info-item">
                    <dt class="label">Città:</dt>
                    <dd class="value" itemprop="address" itemscope itemtype="https://schema.org/PostalAddress">
                        <span itemprop="addressLocality">[Citta]</span>
                    </dd>
                </div>
            </dl>
            <div class="sidebar-actions">
                [Actions]
            </div>
        </aside>
    </div> 
</div>
