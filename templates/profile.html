<main class="profilePageContainer" id="content" tabindex="-1">
    <nav id="breadcrumb" aria-label="Percorso attuale del sito">
        <ul>
        <li><a href="/volontario/">Home</a></li>
        <li aria-current="page">Area Personale</li>
        </ul>
    </nav>
    <div class="profileGrid">
        <h1 class="profilePageTitle">L'Angolo del Volontario</h1>
        <section class="profileInfoColumn" aria-labelledby="profileInfoTitle">
            <h2 id='profileInfoTitle' class='srOnly'>Informazioni generali di [Nome] [Cognome]</h2>
            <div class="userMainInfo">
                <img src="[FotoProfilo]" alt="Foto Profilo di [Nome] [Cognome]" class="userPfP">
                <p class="userIdentity">[Nome] [Cognome]</p>
                <p class="userUsername">@[Username]</p>
            </div>
            <dl class="userInformation">
                <dt class="infoLabel">Nascita:</dt>
                <dd class="infoValue">
                    <time datetime="[DataISO]">[DataVisual]</time>
                </dd>
                <dt class="infoLabel">Città:</dt>
                <dd class="infoValue">
                    <span>[Citta]</span>
                </dd>
            </dl>
            <div class="userButtons">
                [Actions]
            </div>
        </section>
        <div class="volunteerInformation">
          <section class="volunteerBiography">
            <h2 class="cardTitle">Chi sono</h2>
            <p class="biographyText">[Descrizione]</p>
          </section>
          [SezioneReputazione]
          <section id="reviewsSection" class="reviewsGrid" aria-labelledby="reviewsTitle">
              <h2 id="reviewsTitle" class="sectionHeader">Ultime Recensioni</h2>
                [SezioneRecensioni]
          </section>
        </div>
    </div> 
</main>
