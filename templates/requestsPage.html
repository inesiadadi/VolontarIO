<main class="requestPageContainer">
    <h1 class="profilePageTitle">Le mie richieste</h1>
    <aside class="filtersSidebar">
        <a href="/volontario/nuova-richiesta" id="newRequest">Aggiungi richiesta</a>
        <div class="filterBox">
            <h2 class="filterTitle">Filtra Richieste</h2>
            <div class="filterGroup">
                <label for="stateFilter" class="filterSubtitle">
                    Stato
                </label>
                <select id="stateFilter" class="filterSelect">
                    <option value="all">Tutti gli stati</option>
                    <option value="aperta">Aperta</option>
                    <option value="in_carico">In carico</option>
                    <option value="completata">Completata</option>
                    <option value="scaduta">Scaduta</option>
                </select>
            </div>
            [Categorie]
        </div>
    </aside>
    <section class="requestContent">
        <div class="requestGrid" id="grigliaRichieste">
            [Richieste]
        </div>
        <div class="noRequestMsg" id="filterEmptyState">
            <span aria-hidden="true">🌱</span>
            <p>Non ci sono ancora richieste per questo filtro.</p>
        </div>
    </section>
</main>
