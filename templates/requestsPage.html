<main class="requestPageContainer" id='content'>
    <nav id="breadcrumb" aria-label="Percorso attuale del sito">
        <ul>
        <li><a href="/volontario/"><span lang="en-GB">Home</span></a></li>
        <li><a href="/volontario/profilo">Area Personale</a></li>
        <li aria-current="page">Richieste</li>
        </ul>
    </nav>
    <h1 class="profilePageTitle">Le mie richieste</h1>
    <div class="requests-layout-wrapper">
            <aside class="filters-sidebar" aria-label="Filtri recensioni">
                    <div class="filter-header">
                        <h2>Filtra Recensioni</h2>
                        <a href="/volontario/recensioni?id=" class="btn reset-link">Reimposta Filtri</a>
                    </div>
                        <fieldset class="form-group category-group">
                        <legend class="form-label">Valutazione</legend>

                        <label class="checkbox-label">
                            <input type="checkbox" name="state[]" value="aperta">
                            Aperta
                        </label>

                        <label class="checkbox-label">
                            <input type="checkbox" name="state[]" value="in_carico">
                            In Carico
                        </label>

                        <label class="checkbox-label">
                            <input type="checkbox" name="state[]" value="completata">
                            Completata
                        </label>

                        <label class="checkbox-label">
                            <input type="checkbox" name="state[]" value="scaduta">
                            Scaduta
                        </label>
                        </fieldset>
                        [CheckboxesCategorie]
            </aside>
        </div>
    </aside>
        <div class="requestGrid" id="grigliaRichieste">
            [Richieste]
        </div>
        <div class="noRequestMsg" id="filterEmptyState">
            <span aria-hidden="true">🌱</span>
            <p>Non ci sono ancora richieste per questo filtro.</p>
        </div>
</main>
