<section class="valuationSection" aria-labelledby="reputationTitle">
  <h2 id="reputationTitle" class="cardTitle">Reputazione</h2>
  <div class="valuationContainer">
    <div class="valuationScore">
      <span class="valuationValue">[MediaVoto]</span>
      <span class="valuationMax"><span aria-hidden="true">/10</span></span>
      <span class="srOnly">su dieci</span>
      <p class="srOnly">
        Valutazione media: [MediaVoto] su 10, basata su [NumRecensioni] [NumeroRecensioni].
      </p>
    </div>
    <div class="valuationStars" aria-hidden="true">
      <div class="starsWrapper">
        <div class="starsBackground">★★★★★</div>
        <div class="starsColor" data-percentuale="[PercentualeStelle]">★★★★★</div>
      </div>
    </div>
  </div>
</section>
