<section class="valuationSection" itemprop="aggregateRating" itemscope itemtype="https://schema.org/AggregateRating">
    <h2 class="cardTitle">Reputazione</h2>
    <meta itemprop="ratingValue" content="[MediaVoto]">
    <meta itemprop="reviewCount" content="[NumRecensioni]">
    <div class="valuationContainer">
        <div class="valuationScore">
            <span class="valuationValue">[MediaVoto]</span>
            <span class="valuationMax">/10</span>
            <p class="srOnly">Voto basato su [NumRecensioni] recensioni</p> 
        </div>
        <div class="valuationStars">
            <div class="starsWrapper" role="img" aria-hidden="true">
                <div class="starsBackground">★★★★★</div>
                <div class="starsColor" data-percentuale="[PercentualeStelle]">★★★★★</div>
            </div>
        </div>
</section>
