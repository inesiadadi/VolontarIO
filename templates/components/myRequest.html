<article class="requestCard" itemprop="request" itemscope itemtype="https://schema.org/ServiceRequest" data-status="[StatoRichiesta]">
    <span class="requestCategory" itemprop="category">
        [CategoriaServizio]
    </span>
    <span class="requestLocation" itemprop="location">
            [LuogoRichiesta]
    </span>
    <p class="requestText" itemprop="description">

        [DataVisual]
    </time>
    [PulsantieraAzioni]
