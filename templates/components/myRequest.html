<article class="request-card" data-status="[StatoRichiesta]">
    <div class="req-header">
        <span class="visually-hidden">Categoria: </span>
        <span class="category-tag" data-category="category">
            [CategoriaServizio]
        </span>
    </div>
    <div class="req-body">
        <p>[DescrizioneRichiesta]</p>
    </div>
    <div class="req-footer">
        <div class="meta-item">
            <img src="src/images/icon-location.svg" alt="" aria-hidden="true">
            <span class="visually-hidden">Luogo: </span>
            <span>[LuogoRichiesta]</span>
        </div>
        <div class="meta-item">
            <img src="src/images/icon-calendar.svg" alt="" aria-hidden="true">
            <span class="visually-hidden">Data: </span>
            <span>[DataVisual]</span>
        </div>
        <div class="meta-item">
            <img src="src/images/icon-time.svg" alt="" aria-hidden="true">
            <span class="visually-hidden">Orario: </span>
            <span>[OrarioRichiesta]</span>
        </div>
        <div class="action-button">
        [PulsantieraAzioni]
        </div>
    </div>
</article>
