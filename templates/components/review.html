<article class="review-mini" itemprop="review" itemscope itemtype="https://schema.org/Review">
    <div class="review-header">
        <div class="reviewer-identity">
            <img src="[FotoAutore]" alt="Foto di [AutoreRecensione]" class="reviewer-pfp" onerror="this.src='images/default_user.png'">    
            <span itemprop="author" itemscope itemtype="https://schema.org/Person">
                <a href="profilo.php?id=[IdAutore]" class="review-author-link" itemprop="url">
                    <span class="review-author" itemprop="name">[AutoreRecensione]</span>
                </a>
            </span>
        </div>    
        <div class="review-vote" itemprop="reviewRating" itemscope itemtype="https://schema.org/Rating">
            <meta itemprop="worstRating" content="1">
            <meta itemprop="bestRating" content="10">
            <span itemprop="ratingValue">[VotoRecensione]</span>/10
        </div>
    </div>
    <p class="review-text" itemprop="reviewBody">
        "[TestoRecensione]"
    </p>
    <time class="review-date" itemprop="datePublished" datetime="[DataISO]">
        [DataVisual]
    </time>
</article>
