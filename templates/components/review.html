<article class="reviewCard">
    <header class="reviewHeader">
      <div class="reviewerIdentity">
        <img
          src="[FotoAutore]"
          alt="Foto di [AutoreRecensione]"
          class="reviewerPfp"
          loading="lazy"
          width="48"
          height="48"
        >

        <a href="/volontario/profilo?id=[IdAutore]" class="reviewAuthorLink">
          <span id="reviewTitle-[ReviewKey]" class="reviewAuthor">[AutoreRecensione]</span>
        </a>
      </div>

      <p class="reviewVote">
        <span class="srOnly">Valutazione:</span>
        <span data-value="ratingValue" class="reviewVoteValue">[VotoRecensione]</span><span aria-hidden="true">/10</span>
        <span class="srOnly">su dieci</span>
      </p>
    </header>

    <p class="reviewCategory">
      <span class="srOnly">Categoria servizio:</span>
      [CategoriaServizio]
    </p>

    <p class="reviewText">[TestoRecensione]</p>

    <p class="reviewMeta">
      <span class="srOnly">Data:</span>
      <time class="reviewDate" datetime="[DataISO]">[DataVisual]</time>
    </p>
  </article>
