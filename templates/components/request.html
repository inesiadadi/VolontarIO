<article class="request-card">
    <div class="req-header">
        <div class="user-info">
            <img src="[FotoCreatore]" alt="Foto di [NomeCreatore]" class="user-avatar">
            <span class="user-name">[NomeCreatore]</span>
        </div>
        <span class="category-tag">[Categoria]</span>
    </div>
    <div class="req-body">
        <p>[Descrizione]</p>
    </div>
    <div class="req-footer">
        <div class="meta-item">
            <img src="src/images/icon-location.svg" alt="">
            <span>[Luogo]</span>
        </div>
        <div class="meta-item">
            <img src="src/images/icon-calendar.svg" alt="">
            <span>[DataVisual]</span>
        </div>
        <div class="meta-item">
            <img src="src/images/icon-time.svg" alt="">
            <span>[Orario]</span>
        </div>
        <div class="action-button">
        [ActionButton]
        </div>
    </div>
</article>
