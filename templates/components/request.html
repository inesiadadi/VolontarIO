<article class="request-card">
    <div class="req-header">
        <h3 class="sr-only">Richiesta di [NomeCreatore] per [Categoria]</h3>
        <div class="user-info">
            <img src="[FotoCreatore]" alt="" class="user-avatar">
            <p class="user-name">[NomeCreatore]</p>
        </div>
        <span class="sr-only">Categoria: </span>
        <p class="category-tag">[Categoria]</p>
    </div>
    <div class="req-body">
        <span class="sr-only">Descrizione: </span>
        <p>[Descrizione]</p>
    </div>
    <div class="req-footer">
        <div class="meta-item">
            <img src="src/images/icon-location.svg" alt="" aria-hidden="true">
            <p>Luogo: [Luogo]</p>
        </div>
        <div class="meta-item">
            <img src="src/images/icon-calendar.svg" alt="" aria-hidden="true">
            <p>Data: [DataVisual]</p>
        </div>
        <div class="meta-item">
            <img src="src/images/icon-time.svg" alt="" aria-hidden="true">
            <p>Orario: [Orario]</p>
        </div>
        <div class="action-button">
        [ActionButton]
        </div>
    </div>
</article>
