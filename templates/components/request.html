<article class="request-card" aria-labelledby="user">
    <div class="req-header">
        <div class="user-info">
            <img src="[FotoCreatore]" alt="" class="user-avatar">
            <span id="user" class="user-name">[NomeCreatore]</span>
        </div>
        <span class="category-tag" aria-label="Categoria: [Categoria]">[Categoria]</span>
    </div>
    <div class="req-body">
        <span class="sr-only">Descrizione: </span>
        <p>[Descrizione]</p>
    </div>
    <div class="req-footer">
        <div class="meta-item">
            <img src="src/images/icon-location.svg" alt="" aria-hidden="true">
            <p>Luogo:</p>
            <span>[Luogo]</span>
        </div>
        <div class="meta-item">
            <img src="src/images/icon-calendar.svg" alt="" aria-hidden="true">
            <p>Data:</p>
            <span>[DataVisual]</span>
        </div>
        <div class="meta-item">
            <img src="src/images/icon-time.svg" alt="" aria-hidden="true">
            <p>Orario:</p>
            <span>[Orario]</span>
        </div>
        <div class="action-button">
        [ActionButton]
        </div>
    </div>
</article>
