<main class="reviewsPageContainer" id="content">
  <nav id="breadcrumb" aria-label="Percorso attuale del sito">
    <ul>
      <li><a href="/volontario/">Home</a></li>
      <li><a href="/volontario/profilo">Area Personale</a></li>
      <li aria-current="page">Recensioni</li>
    </ul>
  </nav>
  <h1 class="profilePageTitle">Le mie recensioni</h1>
    <div class="requests-layout-wrapper">
        <aside class="filters-sidebar" aria-label="Filtri recensioni">
            <form class="filter-form">
                <div class="filter-header">
                    <h2>Filtra Recensioni</h2>
                    <a href="/volontario/recensioni?id=" class="btn reset-link">Reimposta Filtri</a>
                </div>
                    <fieldset class="form-group category-group">
                    <legend class="form-label">Valutazione</legend>

                    <label class="checkbox-label">
                        <input type="checkbox" name="vote[]" value="1-3">
                        Molto negative (1–3)
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" name="vote[]" value="4-5">
                        Negative (4–5)
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" name="vote[]" value="6-7">
                        Positive (6–7)
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" name="vote[]" value="8-9">
                        Molto positive (8–9)
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" name="vote[]" value="10">
                        Eccellenti (10)
                    </label>
                    </fieldset>

                    [CheckboxesCategorie]
            </form>
        </aside>
    </div>
    <div class="reviewsGrid" id="grigliaRecensioni">
        [Recensioni]
    </div>
    <div class="noReviewsMsg" id="filterEmptyState" role="status" aria-live="polite" hidden>
        <p>Non ci sono ancora recensioni per questo filtro.</p>
    </div>
</main>
