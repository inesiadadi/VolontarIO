<main class="reviewsPageContainer">
    <h1 class="profilePageTitle">Le mie recensioni</h1>
    <aside class="filtersSidebar">
        <div class="filterBox">
            <h2 class="filterTitle">Filtra Recensioni</h2>
            <div class="filterGroup">
                <label for="voteFilter" class="filterSubtitle">
                    Valutazione
                </label>
                <select id="voteFilter" class="filterSelect">
                    <option value="0-10">Tutte le recensioni</option>
                    <option value="1-3">Molto negative (1-3)</option>
                    <option value="4-5">Negative (4-5)</option>
                    <option value="6-7">Positive (6-7)</option>
                    <option value="8-9">Molto positive (8-9)</option>
                    <option value="10-10">Eccellenti (10)</option>
                </select>
            </div>
            <div class="filterGroup">
                <label for="categoryFilter" class="filterSubtitle">Categoria</label>
                <select id="categoryFilter" class="filterSelect">
                    <option value="all">Tutte le categorie</option>
                    <option value="compagnia">Compagnia</option>
                    <option value="dogsitting">Dogsitting</option>
                    <option value="giardinaggio">Giardinaggio</option>
                    <option value="pulizia">Pulizia</option>
                    <option value="ripetizioni">Ripetizioni scolastiche</option>
                    <option value="spesa">Spesa</option>
                </select>
            </div>
        </div>
    </aside>
    <section class="reviewContent">
        <div class="reviewsGrid" id="grigliaRecensioni">
            [Recensioni]
        </div>
        <div class="noReviewsMsg" id="filterEmptyState">
            <span aria-hidden="true">🌱</span>
            <p>Non ci sono ancora recensioni per questo filtro.</p>
        </div>
    </section>
</main>
