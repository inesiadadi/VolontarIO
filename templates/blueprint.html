<!DOCTYPE HTML>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="[Description]">
        <meta name="keywords" content="[Keywords]">
        <meta name="author" content="volontarIO Team">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="index, follow">    
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Trucchetto con media="print" per caricare il font senza bloccare il caricamento, con onload per riattivarlo-->
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
        <!-- Se js non è attivo lo carica normalmente-->
        <noscript>
            <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
        </noscript>

        <title>[Titolo Pagina] | VolontarIO</title>
        
        <link rel="stylesheet" type="text/css" href="src/css/style.css" media="screen">
        <link rel="stylesheet" type="text/css" href="src/css/mini.css" media="screen and (max-width:600px)">
        <link rel="stylesheet" type="text/css" href="src/css/print.css" media="print">
        
        <link rel="shortcut icon" type="image/png" href="src/images/logo_volontarIO.png">
        <link rel="icon" type="image/x-icon" href="src/images/favicon.ico">
        
        <script src="src/js/script.js" defer></script>

    </head>
    <body id="[pageNameId]" [onload]>
    <a id="top" href="#content" class="skip-link">Vai al contenuto principale</a>
    [Header]

    [MainContent]

    [Footer]
    <a href="#top" class="back-to-top" aria-label="Torna all'inizio della pagina"></a>
    </body>
</html>
